name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
      - name: Python tests
        run: .venv/bin/python -m pytest -q
      - name: UI tests
        run: node --test career_radar/static/ui.test.cjs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t career-radar:ci .
      - name: Smoke test
        run: |
          docker run -d --name radar -p 127.0.0.1:8765:8765 -e CAREER_RADAR_SCHEDULER=0 career-radar:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/health; then exit 0; fi
            sleep 2
          done
          docker logs radar
          exit 1
